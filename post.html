<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>बातमी | फक्त बातमी</title>
<meta name="description" content="फक्त बातमी - महाराष्ट्रातील ताज्या बातम्या">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#c8181e;--dark:#171717;--paper:#fff;--gray:#f5f4f2;--border:#e4e2de;--muted:#777}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans Devanagari',Arial,sans-serif;background:var(--gray);color:#1a1a1a;line-height:1.7}a{text-decoration:none;color:inherit}.wrap{max-width:900px;margin:auto;padding:0 18px}header{background:var(--paper);border-bottom:4px solid var(--red);padding:18px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:16px}.logo{font-size:32px;font-weight:700;color:var(--red);line-height:1}.logo span{color:var(--dark)}.back{background:var(--red);color:#fff;padding:8px 16px;border-radius:4px;font-size:13px}main{padding:28px 0}.article{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:28px}.category{color:var(--red);font-size:12px;font-weight:700;margin-bottom:8px}.title{font-size:30px;line-height:1.45;margin-bottom:10px}.meta{color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:20px}.cover{width:100%;max-height:480px;object-fit:cover;border-radius:6px;margin-bottom:22px}.content{font-size:16px;overflow-wrap:anywhere}.content img{max-width:100%;height:auto;margin:18px auto;border-radius:5px}.content a{color:var(--red);text-decoration:underline}.status{text-align:center;color:var(--muted);padding:50px 10px}.error{color:#8b0000;background:#fff0f0;padding:16px;border-radius:5px}@media(max-width:600px){.head{align-items:flex-start}.title{font-size:23px}.article{padding:18px}.content{font-size:15px}.logo{font-size:25px}.back{font-size:11px;padding:7px 10px}}
</style>
</head>
<body>
<header><div class="wrap head"><a href="index.html" class="logo">फक्त <span>बातमी</span></a><a href="index.html" class="back">← मुख्यपृष्ठ</a></div></header>
<main class="wrap"><article class="article" id="article"><div class="status">बातमी लोड होत आहे...</div></article></main>
<script>
(function(){
  var article=document.getElementById('article');
  var source=new URLSearchParams(window.location.search).get('url');
  var feed='https://www.blogger.com/feeds/8273853599882633384/posts/default?alt=json-in-script&max-results=500';

  function path(value){
    try{return new URL(value).pathname.replace(/\/+$/,'').toLowerCase();}
    catch(e){return String(value||'').split('?')[0].replace(/\/+$/,'').toLowerCase();}
  }

  function findEntry(data){
    var entries=data&&data.feed&&data.feed.entry||[];
    var wanted=path(source);
    for(var i=0;i<entries.length;i++){
      var links=entries[i].link||[];
      for(var j=0;j<links.length;j++){
        if(links[j].rel==='alternate'&&path(links[j].href)===wanted)return entries[i];
      }
    }
    return null;
  }

  function loadJsonp(){
    return new Promise(function(resolve,reject){
      var callback='faktbatmiPost'+Date.now();
      var script=document.createElement('script');
      var timer=setTimeout(function(){cleanup();reject(new Error('Blogger feed timeout'));},15000);
      function cleanup(){clearTimeout(timer);delete window[callback];if(script.parentNode)script.parentNode.removeChild(script);}
      window[callback]=function(data){cleanup();resolve(data);};
      script.onerror=function(){cleanup();reject(new Error('Blogger feed error'));};
      script.src=feed+'&callback='+callback;
      document.head.appendChild(script);
    });
  }

  function loadProxy(){
    var url=feed.replace('alt=json-in-script','alt=json');
    return fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url))
      .then(function(r){if(!r.ok)throw new Error('Proxy failed');return r.json();})
      .then(function(d){if(!d.contents)throw new Error('Empty feed');return JSON.parse(d.contents);});
  }

  function esc(value){return String(value||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function image(entry){
    if(entry.media&&entry.media.$t)return entry.media.$t;
    var html=entry.content&&entry.content.$t||'';
    var match=html.match(/<img[^>]+src=["']([^"']+)["']/i);
    return match?match[1]:'';
  }
  function render(entry){
    var title=entry.title&&entry.title.$t||'फक्त बातमी';
    var body=entry.content&&entry.content.$t||entry.summary&&entry.summary.$t||'';
    var date=entry.published&&entry.published.$t?new Date(entry.published.$t).toLocaleDateString('mr-IN',{day:'numeric',month:'long',year:'numeric'}):'';
    var label=entry.category&&entry.category.length?entry.category[0].term:'';
    var img=image(entry);
    document.title=title+' | फक्त बातमी';
    article.innerHTML=(label?'<div class="category">'+esc(label)+'</div>':'')+
      '<h1 class="title">'+esc(title)+'</h1><div class="meta">'+esc(date)+'</div>'+ 
      (img?'<img class="cover" src="'+esc(img)+'" alt="'+esc(title)+'">':'')+
      '<div class="content">'+body+'</div>';
  }

  if(!source){article.innerHTML='<div class="error">ही बातमी उपलब्ध नाही. कृपया मुख्यपृष्ठावरून बातमी निवडा.</div>';return;}
  loadJsonp().catch(loadProxy).then(function(data){
    var entry=findEntry(data);
    if(!entry)throw new Error('Post not found: '+source);
    render(entry);
  }).catch(function(error){
    console.error(error);
    article.innerHTML='<div class="error">बातमी लोड होऊ शकली नाही. कृपया पुन्हा प्रयत्न करा.</div>';
  });
})();
</script>
</body>
</html>
