<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>बातमी | फक्त बातमी</title>
<meta name="description" content="फक्त बातमी - महाराष्ट्रातील ताज्या बातम्या">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#c8181e;--dark:#171717;--paper:#fff;--gray:#f5f4f2;--border:#e4e2de;--muted:#777}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Devanagari',Arial,sans-serif;background:var(--gray);color:#1a1a1a;line-height:1.7}
a{color:inherit;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:0 18px}
header{background:var(--paper);border-bottom:4px solid var(--red);padding:18px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:16px}.logo{font-size:32px;font-weight:700;color:var(--red);line-height:1}.logo span{color:var(--dark)}.back{background:var(--red);color:#fff;padding:8px 16px;border-radius:4px;font-size:13px}
main{padding:28px 0}.article{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:28px}.category{color:var(--red);font-size:12px;font-weight:700;margin-bottom:8px}.title{font-size:30px;line-height:1.45;margin-bottom:10px}.meta{color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:20px}.cover{width:100%;max-height:480px;object-fit:cover;border-radius:6px;margin-bottom:22px}.content{font-size:16px;overflow-wrap:anywhere}.content img{max-width:100%;height:auto;margin:18px auto;border-radius:5px}.content a{color:var(--red);text-decoration:underline}.status{text-align:center;color:var(--muted);padding:50px 10px}.error{color:#8b0000;background:#fff0f0;padding:16px;border-radius:5px}
@media(max-width:600px){.head{align-items:flex-start}.title{font-size:23px}.article{padding:18px}.content{font-size:15px}.logo{font-size:25px}.back{font-size:11px;padding:7px 10px}}
</style>
</head>
<body>
<header><div class="wrap head"><a href="index.html" class="logo">फक्त <span>बातमी</span></a><a href="index.html" class="back">← मुख्यपृष्ठ</a></div></header>
<main class="wrap"><article class="article" id="article"><div class="status">बातमी लोड होत आहे...</div></article></main>
<script>
var article=document.getElementById('article');
var params=new URLSearchParams(location.search);
var source=params.get('url');
var fallback='https://www.blogger.com/feeds/8273853599882633384/posts/default';
function text(v){return v||'';}
function imageFrom(entry){
  if(entry.media&&entry.media.$t)return entry.media.$t;
  var html=entry.content&&entry.content.$t||'';
  var m=html.match(/<img[^>]+src=["']([^"']+)["']/i);
  return m?m[1]:'';
}
function render(entry){
  var title=text(entry.title&&entry.title.$t)||'फक्त बातमी';
  var body=text(entry.content&&entry.content.$t)||text(entry.summary&&entry.summary.$t);
  var date=entry.published&&entry.published.$t?new Date(entry.published.$t).toLocaleDateString('mr-IN',{day:'numeric',month:'long',year:'numeric'}):'';
  var label=entry.category&&entry.category.length?entry.category[0].term:'';
  var image=imageFrom(entry);
  document.title=title+' | फक्त बातमी';
  article.innerHTML=(label?'<div class="category">'+label+'</div>':'')+'<h1 class="title">'+title+'</h1><div class="meta">'+date+'</div>'+(image?'<img class="cover" src="'+image+'" alt="'+title+'">':'')+'<div class="content">'+body+'</div>';
}
function findEntry(data){
  var entries=data.feed&&data.feed.entry||[];
  if(!source)return entries[0];
  for(var i=0;i<entries.length;i++){
    var links=entries[i].link||[];
    for(var j=0;j<links.length;j++)if(links[j].rel==='alternate'&&links[j].href===source)return entries[i];
  }
  return entries[0];
}
function load(url){
  var feed=url+'?alt=json';
  return fetch('https://api.allorigins.win/get?url='+encodeURIComponent(feed)).then(function(r){return r.json();}).then(function(d){return JSON.parse(d.contents);});
}
if(!source){article.innerHTML='<div class="error">ही बातमी उपलब्ध नाही. कृपया मुख्यपृष्ठावरून बातमी निवडा.</div>';}else{
  load(source).then(function(data){var entry=findEntry(data);if(!entry)throw new Error('बातमी सापडली नाही');render(entry);}).catch(function(){
    // A post URL can be requested directly from the Blogger feed by its path.
    var feed=fallback+'?alt=json&max-results=50';
    fetch('https://api.allorigins.win/get?url='+encodeURIComponent(feed)).then(function(r){return r.json();}).then(function(d){var e=findEntry(JSON.parse(d.contents));if(!e)throw new Error();render(e);}).catch(function(){article.innerHTML='<div class="error">बातमी लोड होऊ शकली नाही. कृपया पुन्हा प्रयत्न करा.</div>';});
  });
}
</script>
</body>
</html>
